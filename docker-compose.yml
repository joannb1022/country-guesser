services:
  db:
    image: postgres:17
    container_name: countryguesser-db
    environment:
      POSTGRES_DB: countryguesser
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - countryguesser_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d countryguesser"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  countryguesser_data: