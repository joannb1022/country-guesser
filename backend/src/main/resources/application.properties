spring.application.name=country-guesser
rest-countries.base-url=https://api.restcountries.com/countries/v5
rest-countries.api-key=${REST_COUNTRIES_API_KEY}
spring.config.import=optional:file:.env.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/countryguesser}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true